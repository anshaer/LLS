<body>
<div class="editor">
<aside class="panel">
<h2>區塊</h2>
<div class="tool" draggable="true" data-type="blank">空白區塊</div>
<div class="tool" draggable="true" data-type="text">文字區塊</div>
<div class="tool" draggable="true" data-type="button">按鈕區塊</div>
<div class="tool" draggable="true" data-type="image">圖片區塊</div>
<div class="tool" draggable="true" data-type="carousel">圖片輪播區塊</div>
<div class="tool" draggable="true" data-type="video">影片區塊</div>
<div class="tool" draggable="true" data-type="social">社群區塊</div>
<div class="tool" draggable="true" data-type="embed">自訂內嵌區塊</div>
<div class="tool" draggable="true" data-type="marquee">跑馬燈區塊</div>
<div class="tool" draggable="true" data-type="table">表格區塊</div>
<div class="tool" draggable="true" data-type="time">時間區塊</div>
<div class="tool" draggable="true" data-type="header">頁首區塊</div>
<div class="tool" draggable="true" data-type="nav">導航區塊</div>
<div class="tool" draggable="true" data-type="footer">頁尾區塊</div>
<div class="tool" draggable="true" data-type="tip">提示區塊</div>
<hr>
<h3>網站設定</h3>
<label>頁籤名稱</label><input type="text" id="siteTitle" value="我的網頁" placeholder="我的網頁">
<label>網站圖示</label><input type="file" id="faviconFile" accept="image/png,image/jpeg,image/webp,image/x-icon,.ico">
<button type="button" id="removeFavicon" style="background:#555">移除網站圖示</button>
<p class="hint">頁籤名稱與網站圖示會套用到匯出的網站，匯入 ZIP 時也會還原。</p>
<hr>
<h3>頁面設定</h3>
<label>整頁背景顏色</label><input type="color" id="pageBg" value="#ffffff">
<label>頁面背景圖片</label><input type="file" id="pageBgFile" accept="image/*">
<label>背景尺寸</label><select id="bgSize"><option value="cover">填滿 cover</option><option value="contain">完整 contain</option><option value="auto">原始 auto</option></select>
<label>背景重複</label><select id="bgRepeat"><option value="no-repeat">不重複</option><option value="repeat">重複</option><option value="repeat-x">橫向重複</option><option value="repeat-y">縱向重複</option></select>
<label>背景位置</label><select id="bgPosition"><option value="center">置中</option><option value="top center">上中</option><option value="bottom center">下中</option><option value="left center">左中</option><option value="right center">右中</option></select>
<button onclick="importZip()">匯入 ZIP</button>
<button onclick="exportZip()">匯出 ZIP</button>
<p class="hint">圖片上傳後會一起放進 ZIP 的 assets 資料夾。</p>
</aside>
<main class="stage">
<div class="device-buttons"><button onclick="setDevice('mobile')">手機</button><button onclick="setDevice('tablet')">平板</button><button onclick="setDevice('desktop')">800桌面</button></div>
<section id="canvas" class="canvas mobile">
<div id="headerArea" class="area headerArea" data-area="header"></div>
<div id="contentArea" class="area contentArea" data-area="content"></div>
<div id="footerArea" class="area footerArea" data-area="footer"></div>
</section>
</main>
<aside class="panel"><h2>區塊設定</h2><div id="settings">請先點選區塊</div></aside>
</div>
<div id="lightboxOverlay" class="lightboxOverlay" onclick="closeLightbox(event)"><button class="overlayClose" type="button" onclick="closeLightbox(event)">×</button><img id="lightboxImage" alt="放大圖片" onclick="event.stopPropagation()"></div>
<div id="tipOverlay" class="tipOverlay" onclick="closeTip(event)"><button class="overlayClose" type="button" onclick="closeTip(event)">×</button><div id="tipCard" class="tipCard" onclick="event.stopPropagation()"></div></div>
<script>
const canvas=document.getElementById('canvas'),headerArea=document.getElementById('headerArea'),contentArea=document.getElementById('contentArea'),footerArea=document.getElementById('footerArea'),settings=document.getElementById('settings');
let selected=null,counter=1;const assets=new Map();let pageBgAsset='',faviconAsset='',faviconPreviewUrl='';
let activeNewType='',activeMoveId='';
document.querySelectorAll('.tool').forEach(t=>{t.addEventListener('dragstart',e=>{activeNewType=t.dataset.type;activeMoveId='';showDragGuides();e.dataTransfer.setData('newType',t.dataset.type)});t.addEventListener('dragend',clearDraggingState)});
[headerArea,contentArea,footerArea].forEach(a=>{a.addEventListener('dragover',e=>{e.preventDefault();updateInsertIndicator(e,a)});a.addEventListener('dragleave',e=>{if(!a.contains(e.relatedTarget))hideInsertIndicator(a)});a.addEventListener('drop',dropHandler)});
function ensureInsertIndicator(area){let line=area.querySelector(':scope > .drop-insert-line');if(!line){line=document.createElement('div');line.className='drop-insert-line';area.appendChild(line)}return line}
function destinationAreaForType(type,fallback){if(type==='header'||type==='nav')return headerArea;if(type==='footer')return footerArea;return fallback===contentArea?contentArea:contentArea}
function canMoveToArea(block,area){if(!block)return false;if(block.dataset.type==='header')return area===headerArea;if(block.dataset.type==='footer')return area===footerArea;if(block.dataset.type==='nav')return area===headerArea||area===contentArea;return area===contentArea}
function updateInsertIndicator(e,hoverArea){let area=hoverArea;if(activeNewType)area=destinationAreaForType(activeNewType,hoverArea);else if(activeMoveId){const b=document.getElementById(activeMoveId);if(!canMoveToArea(b,hoverArea)){hideInsertIndicator(hoverArea);return}area=hoverArea}document.querySelectorAll('.area').forEach(x=>{if(x!==area)hideInsertIndicator(x)});const line=ensureInsertIndicator(area),after=getDragAfterElement(area,e.clientY),rect=area.getBoundingClientRect();let top;if(after){top=after.offsetTop-6;line.dataset.beforeId=after.id}else{const blocks=[...area.querySelectorAll(':scope > .block:not(.dragging)')];if(blocks.length){const last=blocks[blocks.length-1];top=last.offsetTop+last.offsetHeight+4}else top=8;line.dataset.beforeId=''}line.style.top=Math.max(2,top)+'px';line.classList.add('show');area.classList.add('insert-target')}
function hideInsertIndicator(area){const line=area&&area.querySelector(':scope > .drop-insert-line');if(line){line.classList.remove('show');line.dataset.beforeId=''}if(area)area.classList.remove('insert-target')}
function getIndicatorBefore(area){const line=area.querySelector(':scope > .drop-insert-line.show');return line&&line.dataset.beforeId?document.getElementById(line.dataset.beforeId):null}
function showDragGuides(){document.querySelectorAll('.area').forEach(x=>x.classList.add('drag-guide'))}function clearDraggingState(){activeNewType='';activeMoveId='';document.querySelectorAll('.block.dragging').forEach(x=>x.classList.remove('dragging'));document.querySelectorAll('.area.drag-guide').forEach(x=>x.classList.remove('drag-guide'));document.querySelectorAll('.area').forEach(hideInsertIndicator)}

function dropHandler(e){e.preventDefault();const type=e.dataTransfer.getData('newType')||activeNewType;if(type){const area=destinationAreaForType(type,e.currentTarget),before=getIndicatorBefore(area);let b;if(type==='header')b=addBlock(type,headerArea,true);else if(type==='nav')b=addBlock(type,headerArea,false);else if(type==='footer')b=addBlock(type,footerArea,true);else b=addBlock(type,contentArea,false);if(b&&before&&b!==before)area.insertBefore(b,before);clearDraggingState();refreshAll();return}const id=e.dataTransfer.getData('moveId')||activeMoveId,b=document.getElementById(id);if(!b)return;const area=e.currentTarget;if(!canMoveToArea(b,area)){clearDraggingState();return}const before=getIndicatorBefore(area)||getDragAfterElement(area,e.clientY);before&&before!==b?area.insertBefore(b,before):area.appendChild(b);clearDraggingState();refreshAll()}

function collectProject(){
 const blocks=[];
 [headerArea,contentArea,footerArea].forEach(area=>{
  [...area.children].forEach(b=>{
   const dataset={...b.dataset};
   delete dataset.preview;
   delete dataset.socialImagePreview;
   delete dataset.carouselPreviews;
   delete dataset.marqueePreviews;
   blocks.push({
    id:b.id,
    area:area.dataset.area,
    dataset,
    style:{
     gridColumn:b.style.gridColumn,
     gridRow:b.style.gridRow,
     borderRadius:b.style.borderRadius,
     color:b.style.color,
     fontSize:b.style.fontSize,
     fontWeight:b.style.fontWeight,
     fontStyle:b.style.fontStyle,
     textDecoration:b.style.textDecoration,
     backgroundImage:b.style.backgroundImage
    }
   });
  });
 });
 return {
  site:{
   title:document.getElementById('siteTitle').value.trim()||'我的網頁',
   faviconAsset:faviconAsset||''
  },
  page:{
   backgroundColor:document.getElementById('pageBg').value,
   backgroundAsset:canvas.dataset.bgAsset||'',
   backgroundSize:document.getElementById('bgSize').value,
   backgroundRepeat:document.getElementById('bgRepeat').value,
   backgroundPosition:document.getElementById('bgPosition').value,
   device:[...canvas.classList].find(x=>['mobile','tablet','desktop'].includes(x))||'mobile'
  },
  blocks
 };
}

async function importZip(){
 const input=document.createElement('input');
 input.type='file';input.accept='.zip,application/zip';
 input.onchange=async()=>{
  const file=input.files&&input.files[0];if(!file)return;
  try{
   const zip=await JSZip.loadAsync(file);
   const entry=zip.file('.editor.json');
   if(!entry){alert('這個 ZIP 不是由此編輯器匯出的。');return;}
   const project=JSON.parse(await entry.async('string'));
   await restoreProject(project,zip);
  }catch(err){console.error(err);alert('ZIP 無法讀取，請確認檔案是否完整。');}
 };
 input.click();
}

  if(!b.style.gridRow)b.style.gridRow='span 4';
  attachBlockEvents(b);
  area.appendChild(b);renderBlock(b);
  const m=b.id.match(/block-(\d+)/);if(m)maxId=Math.max(maxId,Number(m[1]));
 }
 counter=Math.max(counter,maxId+1);
 refreshAll();
}

function restoreAssetPreviews(b){
 if(b.dataset.asset&&assets.has(b.dataset.asset))b.dataset.preview=URL.createObjectURL(assets.get(b.dataset.asset));
 if(b.dataset.socialImageAsset&&assets.has(b.dataset.socialImageAsset))b.dataset.socialImagePreview=URL.createObjectURL(assets.get(b.dataset.socialImageAsset));
 const car=(b.dataset.carouselAssets||'').split('|').filter(Boolean);
 if(car.length)b.dataset.carouselPreviews=car.map(n=>assets.has(n)?URL.createObjectURL(assets.get(n)):'').join('|');
 const mar=(b.dataset.marqueeAssets||'').split('|').filter(Boolean);
 if(mar.length)b.dataset.marqueePreviews=mar.map(n=>assets.has(n)?URL.createObjectURL(assets.get(n)):'').join('|');
}
